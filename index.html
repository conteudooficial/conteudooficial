<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oferta Exclusiva</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background-color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .tag {
      background-color: #ef4444;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 15px;
      line-height: 1.3;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .cta-button {
      display: block;
      width: 100%;
      background-color: #22c55e;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      padding: 15px;
      border-radius: 8px;
      transition: background-color 0.2s;
    }
    .cta-button:hover {
      background-color: #16a34a;
    }
    .footer-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="tag">Tempo Limitado</span>
    <h1>Acesso Exclusivo ao Conteúdo Oficial</h1>
    <p>Clique no botão abaixo para acessar o conteúdo completo de forma imediata e segura.</p>
    
    <!-- Substitua o # pelo seu link de afiliado ou oferta -->
    <a href="https://SEU-LINK-AQUI.com" class="cta-button">ACESSAR AGORA</a>

    <p class="footer-text">Conexão segura SSL 256-bit. Acesso instantâneo.</p>
  </div>

</body>
</html>
